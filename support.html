<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أنا أدعمك</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 30% 0%,#2a1e4d,#0c0e1a 60%);
    color:#fff;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:100%;max-width:420px;background:rgba(24,27,46,.92);border:1px solid #2b2f4d;
    border-radius:22px;padding:22px}
  h1{font-size:22px;margin:0 0 6px;text-align:center}
  .sub{color:#9a9dbd;font-size:13px;text-align:center;margin-bottom:18px;line-height:1.7}
  input,textarea{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:13px;border:1px solid #333a5e;
    background:#12142a;color:#fff;font-size:15px;font-family:inherit}
  textarea{height:86px;resize:none}
  button{width:100%;padding:15px;border:0;border-radius:14px;font-size:17px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#6c5ce7,#c44bd6)}
  .count{text-align:center;color:#b9bbd8;font-size:13px;margin-top:14px}
  .ok{text-align:center;padding:14px;border-radius:14px;background:#1c3a2a;color:#8ef0b6;font-size:15px;display:none}
  .link{display:block;text-align:center;color:#8f92b3;font-size:12px;margin-top:16px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1>❤️ أنا أدعمك</h1>
  <div class="sub">اكتب اسمك وكلمة تشجيع — وتطلع باسمك بقائمة الداعمين</div>
  <input id="name" placeholder="اسمك" autocomplete="name">
  <input id="email" placeholder="إيميلك (اختياري)" inputmode="email">
  <textarea id="msg" placeholder="كلمة تشجيع (اختياري)"></textarea>
  <button onclick="send()">سجّل دعمي</button>
  <div class="count" id="count"></div>
  <div class="ok" id="ok">شكراً لك ❤️ وصل دعمك</div>
  <a class="link" href="https://superagent-aa3aace6.base44.app/functions/supportSign?report">شوف قائمة الداعمين</a>
</div>
<script>
var API = "https://superagent-aa3aace6.base44.app/functions/supportSign";
function device(){
  var ua = navigator.userAgent, m = ua.match(/Android[^;]*; ([^)]+)\)/);
  return (m ? m[1].replace(/Build.*/, "").trim() : (ua.indexOf("iPhone") >= 0 ? "iPhone" : "Browser"));
}
function send(){
  var name = document.getElementById("name").value.trim();
  if (!name) { alert("اكتب اسمك أول"); return; }
  fetch(API, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: name,
      email: document.getElementById("email").value.trim(),
      message: document.getElementById("msg").value.trim(),
      device: device()})
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.ok) {
      document.getElementById("ok").style.display = "block";
      document.getElementById("count").textContent = "صار عدد الداعمين: " + d.count;
      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("msg").value = "";
    } else { alert("صار خطأ، جرّب مرة ثانية"); }
  }).catch(function(){ alert("ما وصل، جرّب مرة ثانية"); });
}
fetch(API).then(function(r){return r.json();}).then(function(d){
  if (d && d.count !== undefined) document.getElementById("count").textContent = "عدد الداعمين هسه: " + d.count;
}).catch(function(){});
</script>
</body>
</html>
