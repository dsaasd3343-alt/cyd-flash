<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>أنا أدعمك</title>
<style>
  body{margin:0;background:#0f1120;color:#eef;font-family:Roboto,Arial,sans-serif;padding:20px;font-size:16px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#9a9dbb;font-size:14px;margin-bottom:20px;line-height:1.7}
  .count{background:#1a1d33;border-radius:16px;padding:16px;text-align:center;margin-bottom:20px}
  .count b{font-size:34px;display:block;color:#8b7cf6}
  label{display:block;font-size:14px;color:#b9bcd8;margin:14px 0 6px}
  input,textarea{width:100%;box-sizing:border-box;background:#181b2e;border:1px solid #2b2f4a;
    border-radius:12px;color:#fff;padding:14px;font-size:16px;font-family:inherit}
  textarea{height:90px;resize:none}
  button{width:100%;margin-top:20px;padding:16px;font-size:18px;font-weight:700;border:0;
    border-radius:14px;background:#6c5ce7;color:#fff}
  .foot{color:#6f7392;font-size:12px;text-align:center;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
  <h1>❤️ أنا أدعمك</h1>
  <div class="sub">إذا تدعمني وتشجعني، اكتب اسمك وخلّي كلمة تشجيع — وتظهر باسمك بقائمة الداعمين</div>

  <div class="count"><b id="num">…</b>صديق يدعمني حتى الآن</div>

  <form action="https://superagent-aa3aace6.base44.app/functions/supportSign" method="POST">
    <label>اسمك *</label>
    <input type="text" name="name" required maxlength="60" placeholder="اسمك">

    <label>إيميلك (اختياري)</label>
    <input type="email" name="email" maxlength="80" placeholder="example@mail.com">

    <label>كلمة تشجيع (اختياري)</label>
    <textarea name="message" maxlength="300" placeholder="اكتب اللي تحبه"></textarea>

    <input type="hidden" name="device" id="dev" value="">

    <button type="submit">سجّل دعمي</button>
  </form>

  <div class="foot">بياناتك تبقى عندي بس، وتنستعمل لقائمة الداعمين فقط</div>

<script>
  (function () {
    var dev = document.getElementById("dev");
    try { dev.value = (navigator.userAgent || "").substring(0, 80); } catch (e) {}
    var num = document.getElementById("num");
    try {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "https://superagent-aa3aace6.base44.app/functions/supportSign", true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4 && xhr.status === 200) {
          try { num.innerHTML = JSON.parse(xhr.responseText).count; } catch (e) {}
        }
      };
      xhr.send();
    } catch (e) {}
  })();
</script>
</body>
</html>
