<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فتح الإعدادات</title>
<style>
  html,body{margin:0;height:100%;background:#0f1120;color:#fff;
    font-family:-apple-system,Roboto,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .box{padding:28px}
  .gear{font-size:74px;line-height:1;margin-bottom:14px}
  h1{font-size:22px;margin:0 0 8px;font-weight:700}
  p{font-size:15px;color:#aab;margin:0 0 22px;line-height:1.6}
  button{font-size:19px;font-weight:700;padding:16px 42px;border:0;border-radius:16px;
    background:#6c5ce7;color:#fff}
  #tip{font-size:13px;color:#8d90a8;margin-top:24px;display:none;line-height:1.8}
</style>
</head>
<body>
<div class="box">
  <div class="gear">⚙️</div>
  <h1>فتح الإعدادات</h1>
  <p>دوس بالشاشة أو على الزر</p>
  <button onclick="go()">افتح الإعدادات</button>
  <div id="tip">
    إذا ما فتحت تلقائياً: افتح شريط الإشعارات ودوس الترس ⚙<br>
    أو اكتب "الإعدادات" بمربع البحث
  </div>
</div>
<script>
var tries = [
  "intent:#Intent;action=android.settings.SETTINGS;end",
  "intent://#Intent;action=android.settings.SETTINGS;end",
  "android-app://com.android.settings",
  "intent:#Intent;action=android.settings.SETTINGS;S.com.android.settings.extra=1;end"
];
function go(){
  for (var i = 0; i < tries.length; i++) {
    try { window.location.href = tries[i]; } catch (e) {}
  }
  setTimeout(function(){ document.getElementById('tip').style.display = 'block'; }, 2200);
}
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(go, 120);
  document.body.addEventListener('click', go);
  document.body.addEventListener('touchstart', go, {passive:true});
});
</script>

<script>
// anonymous visit counter: device type / OS / browser only, no names, no personal data
(function(){
  try {
    var ua = navigator.userAgent || "";
    var m = ua.match(/Android\s([\d.]+)/i);
    var brand = "", model = "";
    var b = ua.match(/;\s*([^;)]+)\s+Build/i);
    if (b) { var parts = b[1].trim().split(" "); brand = parts[0]; model = parts.slice(1).join(" "); }
    var br = "Unknown";
    if (/EdgA|Edg\//i.test(ua)) br = "Edge";
    else if (/SamsungBrowser/i.test(ua)) br = "Samsung Internet";
    else if (/OPR|Opera/i.test(ua)) br = "Opera";
    else if (/Firefox|FxiOS/i.test(ua)) br = "Firefox";
    else if (/Chrome|CriOS/i.test(ua)) br = "Chrome";
    else if (/Safari/i.test(ua)) br = "Safari";
    var body = {
      page: "settings",
      brand: brand,
      model: model,
      os_version: m ? ("Android " + m[1]) : (ua.indexOf("iPhone") >= 0 ? "iOS" : "Other"),
      browser: br,
      screen: window.screen.width + "x" + window.screen.height,
      lang: navigator.language || "",
      referrer: document.referrer || "direct"
    };
    if (navigator.sendBeacon) {
      navigator.sendBeacon("https://api.base44.com/api/apps/6ab9e2f7044ccb3aaa3aace6/functions/trackVisit",
        new Blob([JSON.stringify(body)], {type: "application/json"}));
    } else {
      fetch("https://api.base44.com/api/apps/6ab9e2f7044ccb3aaa3aace6/functions/trackVisit",
        {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
